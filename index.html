<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Learning English</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    iframe {
      border: none;
    }
    /* Contenidor per header + descripció */
    #topSection {
      transition: transform 0.3s ease;
      position: relative;
      z-index: 20;
    }
    #topSection.hidden-scroll {
      transform: translateY(-100%);
    }
    /* L'iframe ha d'omplir tot l'espai */
    #mainContainer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      transition: top 0.3s ease;
    }
    #mainContainer.header-visible {
      top: var(--header-height, 120px);
    }
  </style>
</head>
<body class="bg-gray-100">
  <div class="flex h-full">
    <!-- SIDEBAR -->
    <aside
      id="sidebar"
      class="bg-white w-80 h-full shadow-md fixed top-0 left-0 z-30 p-4 overflow-y-auto hidden lg:block"
    >
      <h2 class="text-lg font-bold mb-4 text-blue-700">
        🎓 Jocs d'Anglès
      </h2>
      <nav class="space-y-2">
        <button
          onclick="loadGame('https://annafarreras.github.io/Learning_English/')"
          class="w-full text-left px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
        >
          🎮 Learning English
        </button>
      </nav>
    </aside>
    
    <!-- CONTINGUT PRINCIPAL -->
    <div class="flex-1 ml-0 lg:ml-80 relative h-full">
      <!-- SECCIÓ SUPERIOR (Header + Descripció) -->
      <div id="topSection">
        <!-- HEADER -->
        <header
          id="header"
          class="bg-blue-600 text-blue-100 text-center text-xl font-bold flex justify-between items-center py-2 px-4"
        >
          <div>
            Benvingut a
            <span class="text-white font-bold">Learning English</span>
          </div>
          <button
            id="toggleSidebar"
            class="lg:hidden px-3 py-1 bg-blue-500 rounded focus:outline-none"
          >
            Menú
          </button>
        </header>
        <!-- DESCRIPCIÓ -->
        <section 
          id="description"
          class="bg-blue-100 text-gray-800 text-center px-4 py-2 lg:py-4"
        >
          <p class="text-sm lg:text-base">
            Tria un joc del menú i juga sense sortir de la pàgina.
          </p>
        </section>
      </div>
      
      <!-- CONTENIDOR IFRAME -->
      <div id="mainContainer" class="header-visible">
        <iframe
          id="viewer"
          src=""
          class="w-full h-full bg-white"
        ></iframe>
      </div>
    </div>
  </div>
  
  <!-- TOGGLE SIDEBAR MOBILE -->
  <script>
    const toggleBtn = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('hidden');
    });
  </script>
  
  <!-- LOAD GAME -->
  <script>
    function loadGame(url) {
      document.getElementById('viewer').src = url;
      if (window.innerWidth < 1024) {
        document.getElementById('sidebar').classList.add('hidden');
      }
    }
  </script>
  
  <!-- AUTO-HIDE HEADER amb TOUCH/SWIPE -->
  <script>
    const topSection = document.getElementById('topSection');
    const mainContainer = document.getElementById('mainContainer');
    const viewer = document.getElementById('viewer');
    
    function updateHeaderHeight() {
      const height = topSection.offsetHeight;
      document.documentElement.style.setProperty('--header-height', height + 'px');
    }
    
    updateHeaderHeight();
    window.addEventListener('resize', updateHeaderHeight);
    
    // Variables per detectar swipe
    let touchStartY = 0;
    let touchEndY = 0;
    let isHeaderVisible = true;
    
    // Detectem toc a l'iframe
    viewer.addEventListener('load', function() {
      try {
        const iframeDoc = viewer.contentDocument || viewer.contentWindow.document;
        
        iframeDoc.addEventListener('touchstart', handleTouchStart, { passive: true });
        iframeDoc.addEventListener('touchmove', handleTouchMove, { passive: true });
        iframeDoc.addEventListener('touchend', handleTouchEnd, { passive: true });
      } catch (e) {
        console.log('Detectant toc des de fora de l\'iframe');
      }
    });
    
    // També escoltem a la finestra principal
    document.addEventListener('touchstart', handleTouchStart, { passive: true });
    document.addEventListener('touchmove', handleTouchMove, { passive: true });
    document.addEventListener('touchend', handleTouchEnd, { passive: true });
    
    function handleTouchStart(e) {
      if (window.innerWidth >= 1024) return;
      touchStartY = e.touches[0].clientY;
    }
    
    function handleTouchMove(e) {
      if (window.innerWidth >= 1024) return;
      touchEndY = e.touches[0].clientY;
    }
    
    function handleTouchEnd() {
      if (window.innerWidth >= 1024) return;
      
      const swipeDistance = touchStartY - touchEndY;
      const minSwipeDistance = 30; // píxels mínims per activar
      
      if (Math.abs(swipeDistance) > minSwipeDistance) {
        if (swipeDistance > 0 && isHeaderVisible) {
          // Swipe cap amunt - amagar header
          topSection.classList.add('hidden-scroll');
          mainContainer.classList.remove('header-visible');
          isHeaderVisible = false;
        } else if (swipeDistance < 0 && !isHeaderVisible) {
          // Swipe cap avall - mostrar header
          topSection.classList.remove('hidden-scroll');
          mainContainer.classList.add('header-visible');
          isHeaderVisible = true;
        }
      }
    }
  </script>
</body>
</html>
